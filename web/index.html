<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gull Vault</title>
<style>
    :root {
    --bg: #6d1a2b;
    --panel: #fffaf0;
    --ink: #2a1215;
    --muted: #6b5558;
    --line: #e3d3b0;
    --user: #7a1f33;
    --user-ink: #ffffff;
    --bot: #f6e7b8;
    --accent: #7a1f33;
    --gold: #f2b705;
    --block: #b3261e;
    --block-bg: #fbe9e7;
  }
  
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    padding: 14px 18px;
    border-bottom: 4px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
  .session { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .session code {
    font-family: Consolas, "SF Mono", monospace;
    color: var(--ink);
    background: var(--bot);
    padding: 2px 7px;
    border-radius: 4px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 5px 11px;
  }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty { margin: auto; color: var(--muted); text-align: center; max-width: 34ch; }
  .msg {
    max-width: 85%;
    padding: 9px 13px;
    border-radius: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 3px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 3px; }
  .msg.blocked {
    align-self: stretch;
    max-width: 100%;
    background: var(--block-bg);
    color: var(--block);
    border: 1px solid var(--block);
    border-radius: 8px;
    font-weight: 600;
  }
  .msg.pending { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    max-height: 140px;
  }
  #send { background: var(--gold); border-color: var(--gold); color: #2a1215; padding: 0 20px; font-weight: 600; }
  button:disabled, textarea:disabled { opacity: 0.55; cursor: not-allowed; }
  @media (prefers-reduced-motion: no-preference) { #log { scroll-behavior: smooth; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Gull Vault</h1>
    <div class="session">
      Session <code id="sid"></code>
      <button type="button" id="new">New session</button>
    </div>
  </header>

  <main id="log" aria-live="polite">
    <p class="empty" id="empty">Ask the bot anything. In the demo, try to make it reveal its hidden instructions.</p>
  </main>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message" aria-label="Message"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
  const API_URL = "https://94v13m7mj1.execute-api.us-east-1.amazonaws.com/chat";

  // Assumed contract (agree on it with Person A):
  //   POST { session_id, message }  ->  200 { reply }
  //   Blocked reply or blocked session -> HTTP 403 or { blocked: true, reason? }
  const BLOCKED_TEXT = "Response withheld: the gateway detected a possible leak of protected instructions.";

  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const form = document.getElementById("form");
  const sidEl = document.getElementById("sid");
  let sessionId = "";
  let sessionNumber = 0;
  let busy = false;

  function newSession() {
    sessionNumber++;
    const rand = crypto.randomUUID ? crypto.randomUUID()
      : Date.now() + "-" + Math.random().toString(16).slice(2);
    sessionId = sessionNumber + "-" + rand;
    sidEl.textContent = "#" + sessionNumber;
    sidEl.title = sessionId;
    log.replaceChildren();
    const p = document.createElement("p");
    p.className = "empty";
    p.id = "empty";
    p.textContent = "New session started. Ask the bot anything.";
    log.appendChild(p);
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function addMsg(kind, text) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();
    const el = document.createElement("div");
    el.className = "msg " + kind;
    el.textContent = text; // textContent only: never render model output as HTML
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function send(text) {
    busy = true;
    sendBtn.disabled = true;
    addMsg("user", text);
    const pending = addMsg("bot pending", "Thinking...");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text })
      });
      let data = {};
      try { data = await res.json(); } catch (e) { /* non-JSON body */ }
      pending.remove();
      if (res.status === 403 || data.blocked) {
        addMsg("blocked", data.reason || BLOCKED_TEXT);
        // A blocked session stays blocked, so stop typing until a new session starts.
        input.disabled = true;
        return;
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      addMsg("bot", data.reply || "(empty reply)");
    } catch (err) {
      pending.remove();
      addMsg("bot", "Could not reach the chat service (" + err.message + "). Check API_URL and try again.");
    } finally {
      busy = false;
      if (!input.disabled) { sendBtn.disabled = false; input.focus(); }
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    input.style.height = "auto";
    send(text);
  });

  // Enter sends, Shift+Enter makes a new line.
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
  document.getElementById("new").addEventListener("click", newSession);

  newSession();
</script>
</body>
</html>
